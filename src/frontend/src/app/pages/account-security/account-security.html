<form class="card" (ngSubmit)="save()">
  <h3>Change password</h3>
  <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="field"><label>Current password</label><input class="input" type="password" name="old" [(ngModel)]="oldPassword" autocomplete="current-password" required></div>
  <div class="field">
    <label>New password</label>
    <input class="input" type="password" name="new" [(ngModel)]="newPassword" autocomplete="new-password" required>
    <span class="hint">At least 8 characters, with a letter and a number.</span>
  </div>
  <div class="field"><label>Confirm new password</label><input class="input" type="password" name="confirm" [(ngModel)]="confirmPassword" autocomplete="new-password" required></div>
  <button class="btn" type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Change password' }}</button>
</form>
