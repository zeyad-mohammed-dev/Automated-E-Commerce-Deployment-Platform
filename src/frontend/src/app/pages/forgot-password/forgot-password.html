<div class="container page">
  <div class="auth card">
    <img class="logo" src="assets/logo.png" alt="Shopora">
    <h1>Reset your password</h1>

    <form *ngIf="step === 'email'" (ngSubmit)="sendCode()">
      <p class="muted" style="margin-bottom: 20px">Enter your email and we will send you a code.</p>
      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="field"><label>Email</label><input class="input" type="email" name="email" [(ngModel)]="email" required></div>
      <button class="btn btn-block" type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send code' }}</button>
    </form>

    <form *ngIf="step === 'reset'" (ngSubmit)="reset()">
      <p class="muted" style="margin-bottom: 20px">If <b>{{ email }}</b> has an account, a code is on its way.</p>
      <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>
      <div class="field"><label>Code</label><input class="input" name="otp" [(ngModel)]="otp" inputmode="numeric" maxlength="6" required></div>
      <div class="field">
        <label>New password</label>
        <input class="input" type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" required>
        <span class="hint">At least 8 characters, with a letter and a number.</span>
      </div>
      <button class="btn btn-block" type="submit" [disabled]="loading || otp.length < 6">{{ loading ? 'Saving...' : 'Change password' }}</button>
    </form>

    <p class="foot"><a class="link" routerLink="/login">Back to log in</a></p>
  </div>
</div>
