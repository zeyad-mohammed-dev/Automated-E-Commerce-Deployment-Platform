# Nginx inside the frontend container:
#  - serves the website files
#  - sends /api and /uploads to the gateway (so the browser only talks to one address)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # product pictures: up to 5 files of 5 MB
    client_max_body_size 30m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Stripe calls this one (only used when PAYMENT_PROVIDER=stripe)
    location = /api/payments/webhook {
        proxy_pass http://paymentservice:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    # Angular is a single page app: any other address returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
